name: Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /srv/fc && git pull"

      - name: Set up / restart Objetivos API (non-blocking)
        run: |
          UNIT_B64=""
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo $UNIT_B64 | base64 -d | sudo -n tee /etc/systemd/system/fc-guide-api.service > /dev/null && sudo -n systemctl daemon-reload && sudo -n systemctl enable --now fc-guide-api && sudo -n systemctl restart fc-guide-api" \
            || echo "::warning::No se pudo (re)iniciar fc-guide-api — probablemente falta sudo sin contraseña para ${{ secrets.VPS_USER }}. El sitio estático se ha desplegado igual."
